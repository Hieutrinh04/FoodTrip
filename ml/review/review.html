<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt nhãn NER — FoodTrip</title>
<style>
  :root { --ink:#231a12; --muted:#6f6357; --line:#e2d8c9; --paper:#f7f1e6; --surface:#fffdf8; --chili:#c8462c; --herb:#2f6b4f; --lantern:#c98a1b; --biz:#f5c9bd; --loc:#cde6d8; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
  header { position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  main { max-width:980px; margin:0 auto; padding:16px; }
  button, select, input { font:inherit; }
  button { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; cursor:pointer; }
  button.primary { background:var(--chili); color:#fff; border-color:var(--chili); }
  button.good { background:var(--herb); color:#fff; border-color:var(--herb); }
  button:disabled { opacity:.5; cursor:default; }
  .muted { color:var(--muted); font-size:13px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; }
  .tokens { display:flex; flex-wrap:wrap; gap:4px; margin:10px 0; user-select:none; }
  .tok { padding:4px 6px; border-radius:6px; border:1px solid transparent; cursor:pointer; position:relative; }
  .tok.B-BUSINESS, .tok.I-BUSINESS { background:var(--biz); }
  .tok.B-LOC, .tok.I-LOC { background:var(--loc); }
  .tok.B-BUSINESS, .tok.B-LOC { border-left:3px solid var(--ink); }
  .tok.sel { outline:2px solid var(--chili); }
  .old .tok { cursor:default; font-size:12px; padding:2px 4px; opacity:.75; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; }
  .sw { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:4px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .status { font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; }
  .s-pending { background:#eee5d6; } .s-approved { background:var(--loc); color:var(--herb); } .s-removed { background:#eadbd6; color:var(--chili); } .s-review { background:#f6e5c3; color:#8a5a00; }
  .note { background:#f6e5c3; border-radius:10px; padding:8px 12px; font-size:13px; margin-top:8px; }
  .bar { height:6px; background:var(--line); border-radius:999px; overflow:hidden; flex:1; min-width:120px; }
  .bar > span { display:block; height:100%; background:var(--herb); }
  kbd { color:var(--ink); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:12px; background:var(--surface); }
  .list { display:grid; gap:4px; max-height:240px; overflow:auto; }
  .list button { border-radius:8px; text-align:left; font-size:13px; padding:4px 10px; display:flex; gap:8px; }
  .empty { text-align:center; padding:60px 20px; }
  @media (max-width:640px) { header { position:static; } }
</style>
</head>
<body>
<header>
  <h1>Duyệt nhãn NER</h1>
  <input type="file" id="file" accept=".json">
  <label class="muted">Người duyệt <input id="reviewer" placeholder="Họ tên" style="width:140px"></label>
  <select id="filter">
    <option value="all">Tất cả</option>
    <option value="pending">Chưa duyệt</option>
    <option value="review">Cần xem lại</option>
    <option value="flagged">Gợi ý cần xem kỹ</option>
    <option value="approved">Đã duyệt</option>
    <option value="removed">Đã loại</option>
  </select>
  <div class="bar" title="Tiến độ"><span id="progress" style="width:0"></span></div>
  <span id="count" class="muted"></span>
  <button id="export" class="primary" disabled>Xuất file đã duyệt</button>
</header>
<main id="app">
  <div class="card empty">
    <p><b>Chọn file <code>ml/review/&lt;tập&gt;-review.json</code></b> để bắt đầu.</p>
    <p class="muted">Đọc <code>ml/training/ANNOTATION-GUIDE.md</code> trước khi duyệt. Tiến độ được lưu tự động trong trình duyệt này; bấm "Xuất file đã duyệt" để lưu ra file.</p>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s)
let data = null, idx = 0, sel = null, storeKey = ''
const LABEL = { 'B-BUSINESS': 'Tên quán', 'B-LOC': 'Địa danh' }
const STATUS = { pending: 'Chưa duyệt', approved: 'Đã duyệt', removed: 'Loại bỏ', review: 'Cần xem lại' }

$('#reviewer').value = localStorage.getItem('ner-reviewer') ?? ''
$('#reviewer').addEventListener('input', (e) => localStorage.setItem('ner-reviewer', e.target.value))

$('#file').addEventListener('change', async (e) => {
  const file = e.target.files[0]; if (!file) return
  data = JSON.parse(await file.text())
  // Keyed by set and caption id, so rebuilding a review file keeps the work already done.
  storeKey = `ner-review:${data.split}`
  const saved = JSON.parse(localStorage.getItem(storeKey) ?? 'null')
  for (const it of data.items) {
    // A saved review only applies to the same caption, split the same way.
    const s = saved?.[it.id]?.tokens === it.tokens.join(" ") ? saved[it.id] : null
    it.gold_tags = s?.gold_tags ?? it.gold_tags ?? [...it.suggested_tags]
    it.status = s?.status ?? it.status ?? (it.flag === 'X' ? 'review' : 'pending')
    it.reviewed_by = s?.reviewed_by ?? it.reviewed_by ?? null
    it.reviewed_at = s?.reviewed_at ?? it.reviewed_at ?? null
    it.comment = s?.comment ?? it.comment ?? ''
  }
  idx = Math.max(0, data.items.findIndex((it) => it.status === 'pending'))
  $('#export').disabled = false
  e.target.blur() // keyboard shortcuts work straight away
  render()
})

function save() {
  const out = Object.fromEntries(data.items.map((it) => [it.id, { tokens: it.tokens.join(" "), gold_tags: it.gold_tags, status: it.status, reviewed_by: it.reviewed_by, reviewed_at: it.reviewed_at, comment: it.comment }]))
  try { localStorage.setItem(storeKey, JSON.stringify(out)) } catch { /* storage full: export still works */ }
}

function visible() {
  const f = $('#filter').value
  return data.items.filter((it) => f === 'all' || (f === 'flagged' ? it.flag : it.status === f))
}

function setSpan(label) {
  if (!sel) return
  const it = data.items[idx]
  const [a, b] = [Math.min(sel[0], sel[1]), Math.max(sel[0], sel[1])]
  // Clearing or relabelling must not leave a dangling I- tag after the span.
  for (let i = a; i <= b; i++) it.gold_tags[i] = label === 'O' ? 'O' : (i === a ? `B-${label}` : `I-${label}`)
  const next = b + 1
  if (next < it.gold_tags.length && it.gold_tags[next].startsWith('I-')) it.gold_tags[next] = 'B-' + it.gold_tags[next].slice(2)
  sel = null; save(); render()
}

function mark(status) {
  const it = data.items[idx]
  if (!$('#reviewer').value.trim()) { alert('Nhập tên người duyệt trước.'); $('#reviewer').focus(); return }
  it.status = status; it.reviewed_by = $('#reviewer').value.trim(); it.reviewed_at = new Date().toISOString()
  save(); go(1)
}

function go(step) {
  const list = visible(); if (!list.length) return render()
  const pos = list.indexOf(data.items[idx])
  const next = list[Math.min(list.length - 1, Math.max(0, (pos < 0 ? 0 : pos) + step))]
  idx = data.items.indexOf(next); sel = null; render()
}

function tokensHtml(tokens, tags, cls = '') {
  return `<div class="tokens ${cls}">${tokens.map((t, i) => `<span class="tok ${tags[i]} ${sel && i >= Math.min(...sel) && i <= Math.max(...sel) ? 'sel' : ''}" data-i="${i}" title="${tags[i]}">${t.replace(/</g, '&lt;')}</span>`).join('')}</div>`
}

function render() {
  const done = data.items.filter((it) => it.status !== 'pending').length
  $('#progress').style.width = `${(done / data.items.length) * 100}%`
  $('#count').textContent = `${done}/${data.items.length} đã xử lý · ${data.items.filter((i) => i.status === 'approved').length} duyệt · ${data.items.filter((i) => i.status === 'removed').length} loại · ${data.items.filter((i) => i.status === 'review').length} xem lại`
  const list = visible()
  if (!list.includes(data.items[idx]) && list.length) idx = data.items.indexOf(list[0])
  const it = data.items[idx]
  if (!list.length || !it) { $('#app').innerHTML = '<div class="card empty">Không có caption nào ở mục này.</div>'; return }
  const changed = it.gold_tags.join() !== it.suggested_tags.join()
  const video = it.video_ids?.[0]
  $('#app').innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <b>${it.id} · ${data.split} (${list.indexOf(it) + 1}/${list.length})</b>
        <span class="status s-${it.status}">${STATUS[it.status]}${it.reviewed_by ? ' · ' + it.reviewed_by : ''}</span>
      </div>
      <p style="font-size:17px;margin:10px 0">${it.tokens.join(' ').replace(/</g, '&lt;')}</p>
      ${video ? `<a class="muted" href="https://www.youtube.com/watch?v=${video}" target="_blank" rel="noopener">Mở video để xem ngữ cảnh ↗</a>` : ''}
      ${it.flag ? `<div class="note"><b>${it.flag === 'X' ? 'Đề xuất loại bỏ' : 'Cần xem kỹ'}:</b> ${it.note}</div>` : ''}
      <div class="legend" style="margin-top:12px">
        <span><span class="sw" style="background:var(--biz)"></span>Tên quán (BUSINESS)</span>
        <span><span class="sw" style="background:var(--loc)"></span>Địa danh (LOC)</span>
        <span class="muted">Viền đậm = bắt đầu một cụm. Bấm một token, Shift + bấm token cuối để chọn cụm.</span>
      </div>
      <div id="edit">${tokensHtml(it.tokens, it.gold_tags)}</div>
      <div class="actions">
        <button data-l="BUSINESS" ${sel ? '' : 'disabled'}>Gán tên quán <kbd>B</kbd></button>
        <button data-l="LOC" ${sel ? '' : 'disabled'}>Gán địa danh <kbd>L</kbd></button>
        <button data-l="O" ${sel ? '' : 'disabled'}>Bỏ nhãn <kbd>O</kbd></button>
        <button id="reset">Về nhãn gợi ý</button>
      </div>
      <details style="margin-top:10px"><summary class="muted">Nhãn tự động cũ (để so sánh)</summary>${tokensHtml(it.tokens, it.auto_tags, 'old')}</details>
      <label class="muted" style="display:block;margin-top:10px">Ghi chú <input id="comment" value="${(it.comment ?? '').replace(/"/g, '&quot;')}" style="width:100%"></label>
      <div class="actions" style="margin-top:14px">
        <button class="good" id="approve">✓ Đã duyệt <kbd>Enter</kbd></button>
        <button id="review">Cần xem lại <kbd>R</kbd></button>
        <button id="remove">Loại bỏ (không liên quan) <kbd>X</kbd></button>
        <span style="flex:1"></span>
        <button id="prev">← Trước <kbd>←</kbd></button>
        <button id="next">Sau → <kbd>→</kbd></button>
      </div>
      ${changed ? '<p class="muted">Đã sửa so với nhãn gợi ý.</p>' : ''}
    </div>
    <div class="card"><b class="muted">Danh sách</b><div class="list">${list.map((x) => `<button data-go="${x.id}" style="${x === it ? 'border-color:var(--chili)' : ''}"><span class="status s-${x.status}">${STATUS[x.status]}</span>${x.flag ? '⚑ ' : ''}${x.tokens.join(' ').slice(0, 90).replace(/</g, '&lt;')}</button>`).join('')}</div></div>`
  document.querySelectorAll('#edit .tok').forEach((el) => el.addEventListener('click', (e) => {
    const i = Number(el.dataset.i)
    sel = e.shiftKey && sel ? [sel[0], i] : [i, i]
    render()
  }))
  document.querySelectorAll('[data-l]').forEach((b) => b.addEventListener('click', () => setSpan(b.dataset.l)))
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => { idx = data.items.findIndex((x) => x.id === b.dataset.go); sel = null; render() }))
  $('#reset').onclick = () => { it.gold_tags = [...it.suggested_tags]; save(); render() }
  $('#approve').onclick = () => mark('approved')
  $('#review').onclick = () => mark('review')
  $('#remove').onclick = () => mark('removed')
  $('#prev').onclick = () => go(-1)
  $('#next').onclick = () => go(1)
  $('#comment').oninput = (e) => { it.comment = e.target.value; save() }
}

$('#filter').addEventListener('change', () => data && render())

document.addEventListener('keydown', (e) => {
  const el = document.activeElement
  const typing = el && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'file'))
  if (!data || typing) return
  const k = e.key.toLowerCase()
  if (k === 'b') setSpan('BUSINESS')
  else if (k === 'l') setSpan('LOC')
  else if (k === 'o') setSpan('O')
  else if (k === 'enter') mark('approved')
  else if (k === 'r') mark('review')
  else if (k === 'x') mark('removed')
  else if (k === 'arrowright') go(1)
  else if (k === 'arrowleft') go(-1)
  else if (k === 'escape') { sel = null; render() }
})

$('#export').addEventListener('click', () => {
  const out = { ...data, exported: new Date().toISOString(), items: data.items }
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = `${data.split}-reviewed.json`
  a.click()
  URL.revokeObjectURL(a.href)
})
</script>
</body>
</html>
